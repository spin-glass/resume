name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10
        
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Check types
      working-directory: packages/web
      run: |
        pnpm astro check
        
    - name: Build Web App
      working-directory: packages/web
      # Vercel Adapter向けにビルド (Static Output)
      run: VERCEL=1 pnpm build

    - name: Verify PDF Generation
      working-directory: packages/web
      # PDF生成は開発サーバーを起動して行うため、依存関係が解決されている必要がある
      run: |
        # 日本語フォントのインストール (Puppeteerで必要になる可能性があるため)
        sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
        # Puppeteer用のChromeブラウザをインストール
        npx puppeteer browsers install chrome
        pnpm pdf

    - name: Upload PDF Artifact
      uses: actions/upload-artifact@v4
      with:
        name: resume-pdf
        path: packages/web/output/resume.pdf
        retention-days: 30
