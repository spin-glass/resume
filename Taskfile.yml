version: '3'

tasks:
  # 開発
  dev:
    desc: Start development server
    cmds:
      - pnpm run dev

  # PDF/DOCX生成
  pdf:
    desc: Generate resume.pdf from MDX
    cmds:
      - npm run pdf
    sources:
      - pages/ja/index.mdx
    generates:
      - resume.pdf

  docx:
    desc: Generate resume.docx from MDX
    cmds:
      - npm run docx
    sources:
      - pages/ja/index.mdx
    generates:
      - resume.docx

  generate:
    desc: Generate both PDF and DOCX
    deps:
      - pdf
      - docx

  # デプロイワークフロー
  update:
    desc: Generate files, commit and push (Usage: task update MESSAGE="your message")
    cmds:
      - task: generate
      - git add pages/ja/index.mdx pages/en/index.mdx resume.pdf resume.docx
      - git commit -m "{{.MESSAGE | default "Update resume"}}"
      - git push origin main
      - echo "✅ Changes pushed to GitHub. Vercel will deploy automatically."

  # デフォルト
  default:
    desc: Show available tasks
    cmds:
      - task --list
