[project]
name = "resume-review-agents"
version = "0.1.0"
description = "Multi-agent resume review system using LangGraph and Claude Sonnet"
authors = [{name = "Toshi", email = "toshi@example.com"}]
requires-python = ">=3.13,<3.14"
dependencies = [
    "langgraph>=1.0.0",
    "langchain-anthropic>=0.1.0",
    "anthropic>=0.25.0",
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "python-frontmatter>=1.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
resume-review = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []
